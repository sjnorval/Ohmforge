# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Rule: no GPL, LGPL or AGPL code is linked into this workspace.
[graph]
all-features = true

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0",
]
confidence-threshold = 0.9
# GPL, LGPL and AGPL are rejected by omission.

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
