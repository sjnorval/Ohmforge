# Dependabot version updates (https://docs.github.com/code-security/dependabot).
# Every update still has to pass CI, including cargo-deny's licence check, so a
# dependency that moves to a licence that is not AGPL-compatible is caught there.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: ["dependencies", "area:ci"]
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels: ["dependencies", "area:ci"]
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
