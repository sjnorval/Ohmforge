# Runs on every push and pull request (https://github.com/sjnorval/Ohmforge/actions).
name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2   # licences, advisories, bans
  test:
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      # Simulation core crates must build for the web target.
      - run: cargo check --target wasm32-unknown-unknown -p of-core -p of-analog -p of-digital -p of-netlist -p of-parts -p of-bom -p of-web -p of-cpu-riscv -p of-components -p of-firmware -p of-soc-esp32c3
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p of-app --features gui
      - run: cargo clippy -p of-ui -p of-app --features of-ui/gui,of-app/gui --all-targets -- -D warnings
      - run: cargo test -p of-ui --features gui
  riscv-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # riscv-tests is BSD-3-Clause; built from a pinned commit, never committed.
      - run: pip install ziglang==0.17.1
      - run: scripts/build-riscv-tests.sh
      - run: cargo test -p of-cpu-riscv --test riscv_tests -- --nocapture
      # Espressif's ESP32-C3 ROM (esp-rom-elfs, Apache-2.0, closed-source
      # code) and espflash's ESP-IDF bootloader (Apache-2.0): pinned,
      # checksummed downloads, never committed.
      - run: scripts/fetch-esp-rom-elfs.sh
      - run: cargo test -p of-soc-esp32c3 --test rom_boot --test esp_hal_blinky
        env: { OF_REQUIRE_ESP_ROM: "1" }
      # The committed test firmware must be reproducible from its source.
      - run: |
          bash firmware/esp32c3-blinky/build.sh
          bash firmware/esp32c3-timer-irq/build.sh
          bash firmware/esp32c3-xip-blinky/build.sh
          git diff --exit-code -- firmware/
      # The esp-hal blinky: Rust 1.95.0 for riscv32imc (its
      # rust-toolchain.toml) and the pinned espflash release binary.
      - run: |
          rustup toolchain install 1.95.0 --profile minimal --component rust-src --target riscv32imc-unknown-none-elf
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/espflash.zip" https://github.com/esp-rs/espflash/releases/download/v4.7.0/espflash-x86_64-unknown-linux-gnu.zip
          echo "8ab3bafeb212ccb1d7a9c422936b9bc86f8b00fe2731053ed8ab875c8d2f0c4d  $RUNNER_TEMP/espflash.zip" | sha256sum -c -
          unzip -o -q "$RUNNER_TEMP/espflash.zip" -d "$RUNNER_TEMP"
          ESPFLASH="$RUNNER_TEMP/espflash" OF_CHECK_BOOTLOADER="$PWD/.cache/esp-rom-elfs/20260528/espflash-v4.7.0-esp32c3-bootloader.bin" \
            bash firmware/esp32c3-esp-hal-blinky/build.sh
          git diff --exit-code -- firmware/
