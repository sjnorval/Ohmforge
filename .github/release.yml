# Categories for GitHub's automatically generated release notes, by PR label.
# https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels: ["duplicate", "invalid", "wontfix"]
  categories:
    - title: New features
      labels: ["enhancement"]
    - title: Parts and models
      labels: ["part-request", "area:parts"]
    - title: Simulation accuracy
      labels: ["accuracy"]
    - title: Bug fixes
      labels: ["bug"]
    - title: Performance
      labels: ["performance"]
    - title: Documentation
      labels: ["documentation", "area:docs"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: CI and tooling
      labels: ["area:ci"]
    - title: Other changes
      labels: ["*"]
