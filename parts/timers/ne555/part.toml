# NE555 precision timer. Analog model: ne555.lib (Ohmforge macromodel,
# original work, CC-BY-SA-4.0 like the rest of parts/). Figures from TI
# "xx555 Precision Timers", SLFS022K (September 1973, revised March 2026):
# section 5.3 Recommended Operating Conditions (VCC 4.5 to 16 V, IO
# +-200 mA), 5.5 Electrical Characteristics (25 C, VCC 5 to 15 V),
# 5.6 Switching Characteristics, Figure 6-1 Simplified Schematic and 6.2
# Functional Block Diagram (5 kOhm divider), 6.3.1 Monostable (tw = 1.1 RA C),
# 6.3.2 Astable (f = 1.44 / ((RA + 2 RB) C)) and Table 6-1 Function Table.
# Timing test tolerances (1 % monostable, 2.25 % astable, typical initial
# error of timing interval) are from the older SLFS022 (revised February
# 1992), page 5, "operating characteristics, VCC = 5 V and 15 V".
[part]
id = "ti.ne555"
name = "NE555 precision timer"
category = "ic/timer"
datasheet = "https://www.ti.com/lit/ds/symlink/ne555.pdf"
model = "spice:ne555.lib"
verification = "datasheet"

[[pin]]
number = "1"
name = "GND"
kind = "power"
[[pin]]
number = "2"
name = "TRIG"
kind = "input"
[[pin]]
number = "3"
name = "OUT"
kind = "output"
[[pin]]
number = "4"
name = "RESET"
kind = "input"
[[pin]]
number = "5"
name = "CONT"
kind = "io"
[[pin]]
number = "6"
name = "THRES"
kind = "input"
[[pin]]
number = "7"
name = "DISCH"
kind = "output"
[[pin]]
number = "8"
name = "VCC"
kind = "power"

[electrical]
vcc = { min = 4.5, max = 16.0, unit = "V", note = "SLFS022K 5.3, NE555" }
thres_level = { min = 8.8, typ = 10.0, max = 11.2, unit = "V", note = "VCC = 15 V (2.4/3.3/4.2 V at 5 V); 5.5" }
trig_level = { min = 4.5, typ = 5.0, max = 5.6, unit = "V", note = "VCC = 15 V (1.1/1.67/2.2 V at 5 V); 5.5" }
cont_open = { min = 9.0, typ = 10.0, max = 11.0, unit = "V", note = "VCC = 15 V, open circuit; 5.5" }
thres_current = { typ = 30e-9, max = 250e-9, unit = "A", note = "5.5" }
trig_current = { typ = 0.5e-6, max = 2e-6, unit = "A", note = "TRIG at 0 V; 5.5" }
reset_level = { min = 0.3, typ = 0.7, max = 1.0, unit = "V", note = "5.5" }
reset_current_high = { typ = 0.1e-3, max = 0.4e-3, unit = "A", note = "RESET at VCC; 5.5" }
reset_current_low = { typ = -0.4e-3, max = -1.5e-3, unit = "A", note = "RESET at 0 V; 5.5" }
disch_off_current = { typ = 20e-9, max = 100e-9, unit = "A", note = "5.5" }
disch_on_voltage = { typ = 0.15, max = 0.4, unit = "V", note = "VCC = 5 V, IO = 8 mA; 5.5" }
vol = { typ = 0.4, max = 0.75, unit = "V", note = "VCC = 15 V, IOL = 50 mA (0.1 V at 10 mA, 2 V at 100 mA); 5.5" }
voh = { min = 12.75, typ = 13.3, unit = "V", note = "VCC = 15 V, IOH = -100 mA (12.5 V at -200 mA; 3.3 V at 5 V, -100 mA); 5.5" }
icc_low = { typ = 10e-3, max = 15e-3, unit = "A", note = "output low, no load, VCC = 15 V (3 mA typ at 5 V); 5.5" }
icc_high = { typ = 9e-3, max = 13e-3, unit = "A", note = "output high, no load, VCC = 15 V (2 mA typ at 5 V); 5.5" }
rise_time = { typ = 100e-9, max = 300e-9, unit = "s", note = "CL = 15 pF, 20 % to 80 %; 5.6" }

[analog]
kind = "subckt"
pins = ["GND", "TRIG", "OUT", "RESET", "CONT", "THRES", "DISCH", "VCC"]
file = "ne555.lib"
subckt = "ne555"
note = "Behavioural macromodel: ideal comparators on the 5k/5k/5k divider, an SR latch with RESET priority, an 8 ohm output stage fitted to the VOH/VOL table and a 19 ohm discharge switch. See ne555.lib for each figure's source."

[[variant]]
label = "DIP-8"
mpn = "NE555P"
manufacturer = "Texas Instruments"
footprint = "Package_DIP:DIP-8_W7.62mm"

[[variant]]
label = "SOIC-8"
mpn = "NE555DR"
manufacturer = "Texas Instruments"
footprint = "Package_SO:SOIC-8_3.9x4.9mm_P1.27mm"

