# Espressif ESP32-C3 (bare chip / module footprint). Only pins that are
# wired in the circuit are elaborated (design §3c). The Rust model is
# `Esp32c3Component` in of-soc-esp32c3 (`model = "rust:esp32c3"`).
[part]
id = "espressif.esp32-c3"
name = "ESP32-C3"
category = "ic/mcu"
model = "rust:esp32c3"
verification = "community"

[[pin]]
number = "1"
name = "3V3"
kind = "power"
[[pin]]
number = "2"
name = "GND"
kind = "ground"
[[pin]]
number = "3"
name = "GPIO0"
kind = "io"
[[pin]]
number = "4"
