# Green 0603 LED. The diode parameters give about 2.2 V at 20 mA, the
# datasheet's typical forward voltage (Kingbright APT1608SGC).
# Datasheet: https://www.kingbrightusa.com/images/catalog/SPEC/APT1608SGC.pdf
[part]
id = "generic.led-green-0603"
name = "LED, green, 0603"
category = "optoelectronic/led"
model = "rust:led"
verification = "community"

[[pin]]
number = "1"
name = "K"
kind = "passive"
[[pin]]
number = "2"
name = "A"
kind = "passive"

[electrical]
vf = { typ = 2.2, max = 2.5, unit = "V", note = "at 20 mA" }
if_max = { max = 25e-3, unit = "A" }

[analog]
kind = "led"
pins = ["A", "K"]
params = { is = 1e-18, n = 2.0, rs = 12.4, cjo = 15e-12, wavelength = 568e-9, eqe = 0.15, if = 20e-3 }

[[variant]]
label = "Green 0603 LED"
mpn = "APT1608SGC"
manufacturer = "Kingbright"
footprint = "LED_SMD:LED_0603_1608Metric"

