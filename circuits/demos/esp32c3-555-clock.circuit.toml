format = 1

[circuit]
name = "ESP32-C3 clock counter (555)"
ground = "gnd"
description = "An NE555 astable (R1 1 kohm, R2 6.8 kohm, C1 1 uF: f = 1/(ln 2 (R1 + 2 R2) C1), about 99 Hz) clocks an ESP32-C3 GPIO4. The NE555 needs 4.5 V or more (TI SLFS022K), so the board is a 5 V board as the C3 dev boards are: the bench supply gives 5 V to the 555 and an AMS1117-3.3 LDO (22 uF tantalum on its output) gives the C3 its 3.3 V. The bipolar 555 output swings to about VCC - 1.7 V, which a 3.3 V input must not see: R3 10 kohm and R4 33 kohm divide it to about 3.1 V (above the C3 VIH of 0.75 VDD = 2.5 V, below VDD + 0.3 V; R3 also limits clamp current). Bare-metal firmware counts rising edges over 100 ms gates of whole periods and prints the frequency on UART0 (GPIO21, RTX stands in for a USB-UART input); the LED on GPIO8 toggles once per gate. Starts cold ([sim] uic)."

[sim]
max_step = 5e-5
uic = true

[[component]]
ref = "U1"
part = "espressif.esp32-c3"
at = [560, 96]
params = { inputs = ["GPIO4"], quiescent_a = 0.016 }

[component.firmware]
app = "../../firmware/esp32c3-clock-counter/clock.elf"
app_sha256 = "0fd6f469fbe19ad8650844171b52d4ab2e6a277a9c7a074cacce67737b7457b1"
boot = "direct"

[component.schematic]
body = [0, 0, 112, 160]
pins = [
  { pin = "3V3", id = "vdd", name = "3V3", at = [24, 0], dir = "N" },
  { pin = "GPIO4", at = [0, 48], dir = "W" },
  { pin = "GND", id = "gnd", name = "GND", at = [24, 160], dir = "S" },
  { pin = "GPIO8", at = [112, 48], dir = "E" },
  { pin = "GPIO21", at = [112, 112], dir = "E" },
]

