format = 1

[circuit]
name = "Pot dimmer"
ground = "gnd"
description = "The ESP32-C3 reads a 10 kohm pot on GPIO2 (ADC) and sets the LEDC duty of a red LED on GPIO8 (esp-hal app, booted through the ROM). The ESP32-C3 draws 23 mA from 3V3 (quiescent_a; datasheet v2.5 Table 5-8, CPU running at 160 MHz)."

[sim]
max_step = 2e-5

[[component]]
ref = "U1"
part = "espressif.esp32-c3"
at = [18, 49]
params = { quiescent_a = 0.023 }

[component.firmware]
app = "../../firmware/esp32c3-esp-hal-adc-pwm/pot_dimmer.bin"
app_sha256 = "279aa8e47920a8aeb808011632e82ebfe073e9874d1fcba2c7c5b717d76d41f0"
boot = "rom"
partitions = "../../firmware/esp32c3-esp-hal-adc-pwm/partitions.bin"
partitions_sha256 = "c9a826e85500d14d1854ce78e47452d4614a1be371bbd056278d2cb3398fbbfd"
ready_text = "ohmforge esp-hal pot dimmer\n"

[component.schematic]
id = "u1"
body = [0, 0, 102, 96]
pins = [
  { pin = "3V3", id = "vdd", name = "VDD", at = [0, 15], dir = "W" },
  { pin = "GPIO8", id = "gpio8", at = [102, 33], dir = "E" },
  { pin = "GPIO2", id = "gpio2", at = [102, 63], dir = "E" },
  { pin = "GND", id = "gnd", at = [102, 84], dir = "E" },
]

[[component]]
ref = "R2"
part = "generic.resistor"
at = [157, 70]
params = { resistance = 330 }

[component.schematic]
body = [0, 0, 50, 24]
pins = [
  { pin = "1", at = [0, 12], dir = "W" },
  { pin = "2", at = [50, 12], dir = "E" },
]

[[component]]
ref = "D1"
part = "generic.led-red-0603"
at = [267, 70]

[component.schematic]
body = [0, 0, 24, 25]
pins = [
  { pin = "A", at = [0, 12], dir = "W" },
  { pin = "K", at = [24, 12], dir = "E" },
]

[[component]]
ref = "RV1"
part = "bourns.ptv09a-b103"
at = [52, 168]
params = { position = 0.5 }

[component.schematic]
body = [0, 0, 20, 60]
pins = [
  { pin = "3", at = [10, 0], dir = "N" },
  { pin = "1", at = [10, 60], dir = "S", stub = true },
  { pin = "W", id = "wiper", name = "wiper", at = [34, 60], dir = "E", slide = { to = [34, 0], param = "position" } },
]

[[component]]
ref = "PSU"
part = "bench.psu"
at = [300, 168]
params = { current_limit = 0.5, on = true, series_r = 0.1, volts = 3.3 }

[component.schematic]
id = "psu"
body = [0, 0, 78, 52]
pins = [
  { pin = "+", id = "plus", at = [0, 14], dir = "W" },
  { pin = "-", id = "minus", name = "−", at = [0, 42], dir = "W" },
]

[[symbol]]
ref = "GND"
kind = "ground"
id = "gnd_sym"
at = [211, 174]
body = [0, 0, 22, 10]
pins = [
  { pin = "1", id = "pin", at = [11, 0], dir = "N" },
]

[[net]]
name = "gpio8"
label = "GPIO8"
kind = "signal"
pins = ["U1.GPIO8", "R2.1"]

[[net]]
name = "led_a"
label = "LED anode"
kind = "signal"
pins = ["R2.2", "D1.A"]

[[net]]
name = "vdd"
label = "VDD"
kind = "power"
pins = ["U1.3V3", "PSU.+", "RV1.3"]

[[net]]
name = "gnd"
label = "GND"
kind = "ground"
pins = ["U1.GND", "D1.K", "PSU.-", "GND.1", "RV1.1"]

[[net]]
name = "gpio2"
label = "GPIO2"
kind = "signal"
pins = ["U1.GPIO2", "RV1.W"]

[schematic]
keepouts = [
  { rect = [18, 28, 112, 40], note = "U1 / ESP32-C3" },
  { rect = [168, 28, 196, 40], note = "R2" },
  { rect = [160, 47, 204, 59], note = "330 ohm" },
  { rect = [264, 28, 288, 40], note = "D1" },
  { rect = [251, 100, 265, 112], note = "A" },
  { rect = [294, 100, 308, 112], note = "K" },
  { rect = [254, 119, 304, 131], note = "Red LED" },
  { rect = [211, 195, 233, 207], note = "GND under symbol" },
  { rect = [96, 232, 120, 244], note = "RV1" },
  { rect = [98, 162, 140, 174], note = "10 kohm" },
  { rect = [36, 172, 50, 184], note = "pin 3" },
  { rect = [36, 214, 50, 226], note = "pin 1" },
  { rect = [50, 252, 74, 264], note = "GND under pot" },
  { rect = [8, 16, 400, 50], note = "Blocks the sky above the chip so the GND return stays under the board instead of looping over the labels at y = 44" },
]

[[probe]]
name = "LED current"
signal = "i(R2)"

[[instrument]]
ref = "XMM1"
kind = "multimeter"
mode = "dc_a"
probes = ["LED current"]

[[instrument]]
ref = "XSC1"
kind = "scope"
probes = ["LED current"]
