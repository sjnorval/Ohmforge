[package]
name = "of-ui"
description = "egui views and instrument panels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
of-core = { workspace = true, optional = true }
of-instruments = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
of-analog = { workspace = true, optional = true }
# Circuit files: parsing for the schematic (no gui); the gui adds the
# builder, the embedded demos and the fetched-ROM lookup.
of-circuit.workspace = true
of-component-api = { workspace = true, optional = true }
of-engine = { workspace = true, optional = true }
of-components = { workspace = true, optional = true }
of-firmware = { workspace = true, optional = true }
of-parts = { workspace = true, optional = true }
of-soc-esp32c3 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
# Trace parity tests (E4b) build the demos through the engine registry.
of-component-api.workspace = true
of-engine.workspace = true

[features]
gui = [
    "dep:egui",
    "dep:of-analog",
    "of-circuit/fs",
    "of-circuit/demos",
    "dep:of-component-api",
    "dep:of-engine",
    "dep:of-components",
    "dep:of-core",
    "dep:of-firmware",
    "dep:of-instruments",
    "dep:of-parts",
    "dep:of-soc-esp32c3",
    "dep:image",
    "dep:serde",
    "dep:toml",
]
