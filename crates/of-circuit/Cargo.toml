[package]
name = "of-circuit"
description = "Circuit file format (*.circuit.toml, format = 1): parse with line and column errors, validate, canonical save."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
of-parts = { workspace = true, optional = true }
of-firmware = { workspace = true, optional = true }

[features]
default = []
# Checks against the parts library and firmware hashes through a `Resolver`.
# Engine E4b adds the circuit-file -> `of_engine::Session` builder behind this feature.
engine = ["dep:of-parts", "dep:of-firmware"]
# Host file system: `FsResolver`, file loading and the parts-directory loader. Not for wasm32.
fs = ["engine"]
