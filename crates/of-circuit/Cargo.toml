[package]
name = "of-circuit"
description = "Circuit file format (*.circuit.toml, format = 1): parse with line and column errors, validate, canonical save."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
of-parts = { workspace = true, optional = true }
of-firmware = { workspace = true, optional = true }
of-core = { workspace = true, optional = true }
of-component-api = { workspace = true, optional = true }
of-engine = { workspace = true, optional = true }

[dev-dependencies]
# The integration tests need every feature; `cargo test --workspace` alone
# would only enable the features other members ask for.
of-circuit = { path = ".", features = ["fs", "demos"] }
of-components.workspace = true
of-soc-esp32c3.workspace = true

[features]
default = []
# Checks against the parts library and firmware hashes through a `Resolver`,
# the circuit-file -> `of_engine` builder and the in-memory resolver.
engine = ["dep:of-parts", "dep:of-firmware", "dep:of-core", "dep:of-component-api", "dep:of-engine"]
# Host file system: `FsResolver`, file loading, the parts-directory loader and
# the fetched-ROM lookup. Not for wasm32.
fs = ["engine"]
# The shipped `circuits/demos` files and the firmware they name, embedded.
demos = ["engine"]
